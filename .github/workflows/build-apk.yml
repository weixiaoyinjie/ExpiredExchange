
name: Build ExpiredExchange APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android source
        run: |
          mkdir -p extracted
          unzip -q ExpiredExchange_v1_OneUpload.zip -d extracted
          ls -la extracted/ExpiredExchange_v1_OneUpload

      - name: Build APK
        working-directory: extracted/ExpiredExchange_v1_OneUpload
        run: |
          gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ExpiredExchange-APK
          path: extracted/ExpiredExchange_v1_OneUpload/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
