
name: Build ExpiredExchange APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          ls -la "$ANDROID_HOME/platforms"

      - name: Extract Android Source
        run: |
          mkdir -p extracted
          unzip -q ExpiredExchange_v1_OneUpload.zip -d extracted
          ls -la extracted/ExpiredExchange_v1_OneUpload

      - name: Build APK
        working-directory: extracted/ExpiredExchange_v1_OneUpload
        run: |
          gradle --version
          gradle --no-daemon --console=plain \
            assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ExpiredExchange-APK
          path: extracted/ExpiredExchange_v1_OneUpload/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
